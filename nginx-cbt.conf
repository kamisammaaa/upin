# Konfigurasi Nginx Reverse Proxy untuk CBT Pintar (UPIN-SMKBA)
# Mengalihkan trafik port 80 ke Next.js (PM2 port 3000) dan offload aset statis

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Batas ukuran upload gambar bank soal (hingga 25 MB)
    client_max_body_size 25M;

    # Kompresi Gzip untuk transmisi jaringan super cepat
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Offloading Berkas Statis Next.js (Dilayani langsung oleh Nginx, membebaskan beban Node.js)
    location /_next/static/ {
        alias /home/kami/upin/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Offloading Gambar Upload Bank Soal
    location /uploads/ {
        alias /home/kami/upin/public/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Berkas Publik PWA (manifest, service worker, icons, favicon)
    location ~* ^/(manifest\.json|sw\.js|favicon\.ico|icon\.png|apple-icon\.png|icons/) {
        root /home/kami/upin/public;
        expires 7d;
        access_log off;
    }

    # 4. Rute Khusus Server-Sent Events (SSE) Live Monitor Proktor & Jadwal
    # Buffering wajib dinonaktifkan agar data monitor real-time mengalir tanpa delay
    location /api/monitor/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # 5. Semua Rute Aplikasi Lainnya (Diteruskan ke PM2 Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
